<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Chocolate Day 🍫</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow: hidden;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #2b0a0a, #5a0f2f, #8b1e3f);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.2rem;
      margin-top: 40px;
      padding: 0 15px;
    }

    button {
      padding: 15px 28px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
      margin-top: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .chocolate {
      position: absolute;
      font-size: 30px;
      animation: fall 3s linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    #finalMessage {
      display: none;
      font-size: 1.6rem;
      margin-top: 40px;
      font-family: 'Pacifico', cursive;
      padding: 0 20px;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>

  <h1>Tap to eat chocolates made with love just for you 🍫</h1>
  <button onclick="startChocolate()">Eat Chocolates</button>

  <div id="finalMessage">
    You are the sweetest part of my life ❤️
  </div>

  <!-- Eating sound -->
  <audio id="eatSound" src="https://assets.mixkit.co/active_storage/sfx/46/46-preview.mp3"></audio>

  <script>
    function startChocolate() {
      const sound = document.getElementById("eatSound");
      sound.play().catch(() => {});

      // create falling chocolates
      for (let i = 0; i < 15; i++) {
        const choco = document.createElement("div");
        choco.classList.add("chocolate");
        choco.innerHTML = "🍫";

        choco.style.left = Math.random() * 90 + "vw";
        choco.style.animationDelay = Math.random() * 1 + "s";

        document.body.appendChild(choco);

        setTimeout(() => {
          choco.remove();
        }, 4000);
      }

      // reveal final message
      setTimeout(() => {
        document.getElementById("finalMessage").style.display = "block";
      }, 2500);
    }
  </script>

</body>
</html>
