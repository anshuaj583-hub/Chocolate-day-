<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Chocolate Day 🍫</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #2b0a0a, #5a0f2f, #8b1e3f);
      font-family: 'Poppins', sans-serif;
      color: #ffc0cb;
      text-align: center;
      height: 100vh;
    }

    .screen {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      cursor: pointer;
    }

    .title {
      font-family: 'Lobster', cursive;
      font-size: 46px;
      margin-bottom: 20px;
      padding: 0 20px;
      color: #ffc0cb;
    }

    .tap {
      font-size: 18px;
      opacity: 0.85;
      color: #ffd6e0;
    }

    .chocolate {
      position: absolute;
      font-size: 90px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      from {
        transform: translateY(-100px);
        opacity: 1;
      }
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    .final-message {
      position: absolute;
      bottom: 100px;
      width: 100%;
      font-size: 34px;
      font-family: 'Lobster', cursive;
      opacity: 0;
      transition: opacity 1.5s;
      padding: 0 20px;
      color: #ffd1dc;
    }
  </style>
</head>
<body>

<div class="screen" id="startScreen">
  <div class="title">
    Happy Chocolate Day<br>
    Sweetheart Kuchu Puchu 🍫
  </div>
  <div class="tap">Tap anywhere</div>
</div>

<div class="final-message" id="finalMsg">
  All these chocolates… and still not as sweet as you.
</div>

<script>
  const startScreen = document.getElementById("startScreen");
  const finalMsg = document.getElementById("finalMsg");

  const chocolates = ["🍫", "🍬", "🍩", "🍪"];

  startScreen.addEventListener("click", () => {
    startScreen.style.display = "none";

    const rain = setInterval(() => {
      for (let i = 0; i < 4; i++) {
        const choco = document.createElement("div");
        choco.classList.add("chocolate");
        choco.innerText = chocolates[Math.floor(Math.random() * chocolates.length)];

        choco.style.left = Math.random() * 100 + "vw";
        choco.style.animationDuration = (2 + Math.random() * 2) + "s";

        document.body.appendChild(choco);

        setTimeout(() => {
          choco.remove();
        }, 4000);
      }
    }, 300);

    setTimeout(() => {
      finalMsg.style.opacity = "1";
    }, 4000);
  });
</script>

</body>
</html>
